<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>N Gera · Projects</title>
  <meta name="description" content="Public projects by N Gera">
  <style>
    :root {
      --bg: #fafaf9; --surface: #ffffff; --text: #1c1917; --muted: #78716c;
      --border: #e7e5e4; --accent: #2563eb; --accent-soft: #eff6ff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0c0a09; --surface: #1c1917; --text: #f5f5f4; --muted: #a8a29e;
        --border: #292524; --accent: #60a5fa; --accent-soft: #172554;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.5;
    }
    .wrap { max-width: 960px; margin: 0 auto; padding: 56px 16px 80px; }
    header h1 { margin: 0 0 4px; font-size: 2rem; letter-spacing: -0.02em; }
    header p { margin: 0; color: var(--muted); }
    header .links { margin-top: 12px; }
    header .links a { margin-right: 16px; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .toolbar { display: flex; gap: 12px; align-items: center; margin: 36px 0 20px; flex-wrap: wrap; }
    .toolbar input {
      flex: 1; min-width: 200px; padding: 10px 14px; font-size: 15px;
      border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text);
    }
    .count { color: var(--muted); font-size: 14px; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    .card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
      padding: 20px; display: flex; flex-direction: column; gap: 10px;
      transition: border-color .15s, transform .15s;
    }
    .card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .card h2 { margin: 0; font-size: 1.1rem; word-break: break-word; }
    .card p { margin: 0; color: var(--muted); font-size: 14px; flex: 1; }
    .meta { display: flex; gap: 14px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
    .actions { display: flex; gap: 16px; font-size: 14px; font-weight: 500; }
    .badge {
      font-size: 12px; padding: 2px 8px; border-radius: 999px;
      background: var(--accent-soft); color: var(--accent);
    }
    .status { color: var(--muted); padding: 24px 0; }
    footer { margin-top: 56px; color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>N Gera</h1>
      <p>Solo founder and developer. These are the projects I'm working on in public.</p>
      <div class="links">
        <a href="https://github.com/ngera">GitHub</a>
      </div>
    </header>

    <div class="toolbar">
      <input id="search" type="search" placeholder="Filter projects…" aria-label="Filter projects">
      <span class="count" id="count"></span>
    </div>

    <main class="grid" id="repos"><div class="status">Loading projects…</div></main>

    <footer>Repository list is pulled live from GitHub.</footer>
  </div>

  <script>
    const USER = "ngera";
    const grid = document.getElementById("repos");
    const count = document.getElementById("count");
    const search = document.getElementById("search");
    let repos = [];

    const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    const fmtDate = iso => new Date(iso).toLocaleDateString(undefined,
      { year: "numeric", month: "short", day: "numeric" });

    function render(list) {
      count.textContent = `${list.length} project${list.length === 1 ? "" : "s"}`;
      if (!list.length) {
        grid.innerHTML = `<div class="status">No matching projects.</div>`;
        return;
      }
      grid.innerHTML = list.map(r => `
        <article class="card">
          <h2>${esc(r.name)}</h2>
          <p>${esc(r.description) || "No description yet."}</p>
          <div class="meta">
            ${r.language ? `<span>${esc(r.language)}</span>` : ""}
            ${r.stargazers_count ? `<span>★ ${r.stargazers_count}</span>` : ""}
            <span>Updated ${fmtDate(r.pushed_at)}</span>
            ${r.has_pages ? `<span class="badge">Live page</span>` : ""}
          </div>
          <div class="actions">
            ${r.has_pages ? `<a href="/${encodeURIComponent(r.name)}/">Project page →</a>` : ""}
            <a href="${esc(r.html_url)}">Code</a>
          </div>
        </article>`).join("");
    }

    search.addEventListener("input", () => {
      const q = search.value.trim().toLowerCase();
      render(repos.filter(r =>
        r.name.toLowerCase().includes(q) ||
        (r.description || "").toLowerCase().includes(q) ||
        (r.language || "").toLowerCase().includes(q)));
    });

    // This endpoint returns only PUBLIC repos.
    fetch(`https://api.github.com/users/${USER}/repos?per_page=100&type=owner&sort=pushed`)
      .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(data => {
        repos = data.filter(r =>
          !r.private && !r.fork && !r.archived &&
          r.name.toLowerCase() !== `${USER}.github.io` &&
          r.name.toLowerCase() !== USER);
        render(repos);
      })
      .catch(() => {
        grid.innerHTML = `<div class="status">Couldn't load projects right now.
          <a href="https://github.com/${USER}?tab=repositories">See them on GitHub →</a></div>`;
      });
  </script>
</body>
</html>
